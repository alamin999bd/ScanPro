name: Build Document Scanner APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, ocr, document-scanner-premium]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Locate project
        run: |
          test -f gradlew || { echo "gradlew not found at repository root"; exit 1; }
          echo "PROJECT_DIR=." >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Download OCR language data (Bangla + English)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p app/src/main/assets/tessdata
          for lang in ben eng; do
            curl -fsSL --retry 3 -o "app/src/main/assets/tessdata/$lang.traineddata" "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$lang.traineddata"
            test -s "app/src/main/assets/tessdata/$lang.traineddata"
          done
          ls -lh app/src/main/assets/tessdata

      - name: Download Noto Sans Bengali font and OFL license
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p app/src/main/assets/fonts
          FONT_BASE="https://raw.githubusercontent.com/notofonts/noto-fonts/main/hinted/ttf/NotoSansBengali"
          curl -fsSL --retry 3 -o app/src/main/assets/fonts/NotoSansBengali.ttf "$FONT_BASE/NotoSansBengali-Regular.ttf"
          curl -fsSL --retry 3 -o app/src/main/assets/fonts/NotoSans-Regular.ttf "https://raw.githubusercontent.com/notofonts/noto-fonts/main/hinted/ttf/NotoSans/NotoSans-Regular.ttf"
          curl -fsSL --retry 3 -o app/src/main/assets/fonts/NotoSansBengali-OFL.txt "https://raw.githubusercontent.com/notofonts/noto-fonts/main/LICENSE"
          test -s app/src/main/assets/fonts/NotoSansBengali.ttf
          test -s app/src/main/assets/fonts/NotoSans-Regular.ttf
          test -s app/src/main/assets/fonts/NotoSansBengali-OFL.txt
          ls -lh app/src/main/assets/fonts

      - name: Prepare font for PDF text-layer tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p app/src/test/resources
          cp app/src/main/assets/fonts/NotoSansBengali.ttf app/src/test/resources/NotoSansBengali.ttf
          cp app/src/main/assets/fonts/NotoSans-Regular.ttf app/src/test/resources/NotoSans-Regular.ttf

      - name: Prepare PDFBox Android assets for Robolectric tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          # Resolve the exact AAR through the app's declared Gradle dependency.
          # This avoids a second, direct Maven Central download (which was rate-limited).
          cat > "$RUNNER_TEMP/stage-pdfbox.init.gradle" <<'GRADLE'
          allprojects { p ->
              p.afterEvaluate {
                  if (p.path == ':app') {
                      p.tasks.register('stagePdfBoxAndroidAssets') {
                          doLast {
                              def version = '2.0.27.0'
                              def configuration = p.configurations.getByName('debugRuntimeClasspath')
                              def artifact = configuration.resolvedConfiguration.resolvedArtifacts.find {
                                  it.moduleVersion.id.group == 'com.tom-roush' &&
                                  it.name == 'pdfbox-android' &&
                                  it.moduleVersion.id.version == version
                              }
                              if (artifact == null) {
                                  throw new GradleException("Could not resolve com.tom-roush:pdfbox-android:${version} from debugRuntimeClasspath")
                              }

                              def aar = artifact.file
                              if (!aar.isFile() || aar.length() == 0) {
                                  throw new GradleException("Resolved PDFBox AAR is missing or empty: ${aar}")
                              }

                              def assetsDir = p.file('src/main/assets')
                              def zip = new java.util.zip.ZipFile(aar)
                              int copied = 0
                              try {
                                  def entries = zip.entries()
                                  while (entries.hasMoreElements()) {
                                      def entry = entries.nextElement()
                                      if (!entry.isDirectory() && entry.name.startsWith('assets/')) {
                                          def relative = entry.name.substring('assets/'.length())
                                          def output = new File(assetsDir, relative)
                                          output.parentFile.mkdirs()
                                          zip.getInputStream(entry).withCloseable { input ->
                                              output.withOutputStream { stream -> stream << input }
                                          }
                                          copied++
                                      }
                                  }
                              } finally {
                                  zip.close()
                              }

                              def identityH = new File(assetsDir, 'com/tom_roush/fontbox/resources/cmap/Identity-H')
                              if (copied == 0 || !identityH.isFile() || identityH.length() == 0) {
                                  throw new GradleException("PDFBox assets were not staged correctly; copied=${copied}, Identity-H=${identityH}")
                              }
                              println("Staged ${copied} PDFBox AAR assets from ${aar} into app/src/main/assets.")
                          }
                      }
                  }
              }
          }
          GRADLE

          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --init-script "$RUNNER_TEMP/stage-pdfbox.init.gradle" :app:stagePdfBoxAndroidAssets

      - name: Verify Bengali and Latin font glyph coverage
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 -m pip install --disable-pip-version-check fonttools
          python3 - <<'PY'
          from fontTools.ttLib import TTFont

          def codepoints(path):
              font = TTFont(path)
              result = set()
              for table in font["cmap"].tables:
                  result.update(table.cmap.keys())
              return result

          bengali = codepoints("app/src/main/assets/fonts/NotoSansBengali.ttf")
          latin = codepoints("app/src/main/assets/fonts/NotoSans-Regular.ttf")
          required_bengali = {ord(c) for c in "বাংলা পরীক্ষা"}
          required_latin = {ord(c) for c in "English searchable text"}
          missing_bn = sorted(required_bengali - bengali)
          missing_en = sorted(required_latin - latin)
          if missing_bn or missing_en:
              raise SystemExit(
                  f"Missing Bengali glyphs: {[hex(x) for x in missing_bn]}; "
                  f"missing Latin glyphs: {[hex(x) for x in missing_en]}"
              )
          print(f"Font coverage verified: Bengali={len(bengali)}, Latin={len(latin)} code points")

      - name: Run unit tests with full failure details
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          cat > "$RUNNER_TEMP/test-logging.init.gradle" <<'GRADLE'
          allprojects {
              tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
                  testLogging {
                      events "failed"
                      exceptionFormat "full"
                      showExceptions = true
                      showCauses = true
                      showStackTraces = true
                  }
              }
          }
          GRADLE
          ./gradlew --no-daemon --console=plain --init-script "$RUNNER_TEMP/test-logging.init.gradle" testDebugUnitTest --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Document-Scanner-Unit-Test-Reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Run OfficeConverter tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # GitHub-hosted Linux runners may not expose KVM. Android Emulator
          # otherwise exits immediately with "-accel off is not supported".
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          # Use a current Android image on the stable Ubuntu 24.04 runner.
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          emulator-boot-timeout: 900
          # Software-emulated ADB settings calls can drop the emulator connection.
          # Leave animations enabled; test correctness does not depend on animation speed.
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # The emulator action executes each script line in a separate sh process;
          # keep loops and conditionals in a standalone POSIX shell script.
          script: sh .github/scripts/run-office-converter-tests.sh

      - name: Build debug and release APKs
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          set -o pipefail
          # Room KSP writes the same exported schema directory for both variants.
          # Run variants sequentially so their schema generation cannot race.
          ./gradlew --no-daemon --console=plain assembleDebug 2>&1 | tee build.log
          ./gradlew --no-daemon --console=plain assembleRelease 2>&1 | tee -a build.log

      - name: Build error summary
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "## Build errors" >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |What went wrong|Could not |Execution failed|error:|Unresolved|Caused by" -A3 build.log | head -100 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Verify APK outputs
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk

      - name: Verify APK signatures and signing identity
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"

          "$APKSIGNER" verify --verbose --print-certs "$DEBUG_APK" > debug-signing-report.txt 2>&1
          "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK" > release-signing-report.txt 2>&1

          echo "### Debug APK apksigner report"
          cat debug-signing-report.txt
          echo "### Release APK apksigner report"
          cat release-signing-report.txt

          DEBUG_CERT="$(awk 'tolower($0) ~ /certificate sha-256 digest/ { sub(/^.*: */, ""); print; exit }' debug-signing-report.txt)"
          RELEASE_CERT="$(awk 'tolower($0) ~ /certificate sha-256 digest/ { sub(/^.*: */, ""); print; exit }' release-signing-report.txt)"

          {
            echo "## APK signing verification"
            echo "- Debug APK signature: valid (apksigner verify passed)"
            echo "- Release APK signature: valid (apksigner verify passed)"
            if [[ -n "$DEBUG_CERT" ]]; then echo "- Debug certificate SHA-256: `$DEBUG_CERT`"; else echo "- Debug certificate fingerprint: unavailable in tool output"; fi
            if [[ -n "$RELEASE_CERT" ]]; then echo "- Release certificate SHA-256: `$RELEASE_CERT`"; else echo "- Release certificate fingerprint: unavailable in tool output"; fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -n "${SCANPRO_KEYSTORE_PATH:-}" ]]; then
            echo "- Release signing identity: configured SCANPRO keystore." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Release signing identity: Gradle debug-key fallback (not a Play Store production signing key)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Package full source project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          git archive --format=zip --output Document-Scanner-Source.zip HEAD
          test -s Document-Scanner-Source.zip
          unzip -t Document-Scanner-Source.zip
          ls -lh Document-Scanner-Source.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Document-Scanner-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            debug-signing-report.txt
            release-signing-report.txt
            Document-Scanner-Source.zip
          if-no-files-found: error
          retention-days: 30
